name: Build Win32

on:
  push:
  workflow_dispatch:

jobs:
  build-win32:
    runs-on: windows-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Setup MSVC x86
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Configure and Build Release Win32
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A Win32 -DEXCEPTION_HANDLING=ON -DVULKAN=ON ..
        cmake --build . --config Release --target package_default

    - name: Upload Win32 Client
      uses: actions/upload-artifact@v4
      with:
        name: TClient-win32
        path: build/*-win32.zip
