name: Build Win32

on:
  push:
  workflow_dispatch:

jobs:
  build-win32:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install MinGW32 and Tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y mingw-w64 cmake ninja-build python3 zip
        rustup target add i686-pc-windows-gnu

    - name: Configure and Build Release Win32
      run: |
        mkdir build
        cd build
        cmake -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchains/mingw32.toolchain \
          -DCMAKE_BUILD_TYPE=Release \
          -DVULKAN=OFF \
          -DWEBSOCKETS=OFF \
          ..
        cmake --build . --target package_default

    - name: Upload Win32 Client
      uses: actions/upload-artifact@v4
      with:
        name: TClient-win32
        path: build/*-win32.zip
